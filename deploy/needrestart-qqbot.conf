# Keep needrestart from restarting qqbot after library upgrades.
#
# unattended-upgrades restarts every service still linked against updated
# libraries. A large batch (openssl, libc, glib, ...) restarted qqbot four
# times within three minutes, which tripped systemd's StartLimitBurst and left
# the bot failed with "start-limit-hit" until an admin reset it by hand.
#
# qqbot is a long-lived websocket client; restarting it mid-upgrade buys
# nothing because it loads the new libraries whenever it is next restarted.
$nrconf{override_rc}{qr(^qqbot(\.service)?$)} = 0;
