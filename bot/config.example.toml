[onebot]
url = "ws://127.0.0.1:3001"
token = ""            # normally supplied by ONEBOT_TOKEN in /etc/qqbot/bot.env
self_id = 0              # your bot QQ number

[llm]
# Fallback thin client only (used when [dsh] enabled = false). The model,
# endpoint, key env, max output tokens and reasoning effort come from the
# [models] registry; only sampling/transport knobs live here.
temperature = 1.0
timeout = 60.0

[dsh]
enabled = true
home = "/var/lib/qqbot/dsh-home"
workspace = "/var/lib/qqbot/dsh-workspace"
profile = "qqbot"
request_timeout = 120.0
# Image handling for the persistent DSH session.
# placeholder: save the original under workspace/<image_dir>/<sha1>.<ext> and
#   send only a short description + relative path; the model can read the
#   original on demand (tool-fs.readImage must be true).
# inline: old behavior, send image blocks and let DSH replay them.
image_mode = "placeholder"
image_dir = "images"
image_caption = true
caption_prompt = "用一两句中文客观描述这张图片；其中有文字就照抄关键文字。只输出描述。"
image_max_bytes = 8388608
image_keep_days = 14
image_max_files = 1000
# Optional vision captions run in parallel per image; a slow model must not
# delay the reply. Each image is capped at image_prepare_timeout seconds and
# each caption call gets image_caption_timeout seconds with no retry.
image_caption_timeout = 15
image_prepare_timeout = 30
# DSH session rotation. Generation 0 keeps the historical id; later
# generations append -gN. Old JSONL files are kept on disk.
# Groups rotate after this much idle time, or at the first message after
# session_rotate_daily_hour (local time); private chats use the private idle.
session_rotate_idle_hours = 24
session_rotate_idle_hours_private = 168
session_rotate_max_hours = 0
session_rotate_max_messages = 0
session_rotate_daily_hour = 4
# Compaction thresholds (thresholdRatio/headroom/retainRatio) live in
# dsh/qqbot.cordis.patch.yml.

[models]
# SQLite registry with two tables: providers (connection metadata shared by a
# provider's models) and models (primary key provider + model_id). The admin
# UI's model page manages both; the CLI can still edit rows. API keys are
# entered in the panel and stored in models.db (0600).
#   main.py --list-models
#   main.py --use-model opencode-go/deepseek-v4.1-flash
#   main.py --set-model opencode-go/deepseek-v4.1-flash reasoning_effort=medium
database = "/var/lib/qqbot/models.db"
patch = "/var/lib/qqbot/dsh-state/models.patch.json"

[cards]
# Character card library. Cards are stored as normalised V3 payloads in SQLite;
# the active card is hot-switched with /card use (no restart, sessions kept).
#   main.py --list-cards | --search-cards <query>
#   main.py --install-card <url|path>
#   main.py --use-card <id|name>
database = "/var/lib/qqbot/characters.db"
# Legacy single-card file. Imported when the library is empty; while that card
# stays active its mtime is watched, so editing the file still hot-reloads.
bootstrap = "/etc/qqbot/character.json"

[stickers]
# Sticker (表情包) library. Images QQ marks as stickers are collected from
# group chats only, deduplicated by content, and stored next to SQLite.
collect = true
max_per_hour = 20          # per group
max_bytes = 8388608        # 8 MB per sticker
max_stored = 500           # oldest/least-used are evicted beyond this
# Re-encoded copies of the same sticker are merged when their 64-bit dHash
# differs by at most this many bits (0 = only pixel-identical images).
# Deleting a sticker with "block similar" stores its dHash in sticker_blocks;
# later uploads within this distance are rejected at collection time.
phash_distance = 4
# The model asks to send one with a trailing "[表情: 语气词]" line; the adapter
# picks a sticker whose tags/description match and sends it after the text.
send = true
send_cooldown_seconds = 60
max_sends_per_hour = 10    # per chat
database = "/var/lib/qqbot/stickers.db"
directory = "/var/lib/qqbot/stickers"

[relation]
# Legacy per-user affinity used only while [story] is disabled.
# Story mode keeps this table read-only and uses scoped, event-based relations.
enabled = true
start_affinity = 20
max_delta = 3
cooldown_seconds = 60
max_changes_per_day = 20

[story]
# Opt in via this flag or the private admin Story page. A card switch then
# prepares the public story automatically; each /story start owns its own save.
enabled = false
timeout = 120           # one model call, not the entire preparation
stage_timeout = 240     # includes at most one repair per stage
prepare_timeout = 420   # brief + graph end-to-end deadline
queue_timeout = 20
brief_tokens = 1800
scene_tokens = 1200
output_mode = "legacy" # text | json_object | json_schema (confirmed providers only)
max_tokens = 6000
max_context_chars = 24000
concurrency = 2
menu_hours = 168
daily_chat_gain = 5
chat_cooldown = 120
json_mode = false  # true only for providers supporting response_format
# Per-character overrides use local character_id, never a display name:
# [story.character_preferences."<32-character local id>"]
# enabled = true
# tone = "嘴硬心软，尊重自主选择"
# pace = "日常铺垫、共同经历、冲突修复；不要跳到恋人"

[usage]
# Token ledger and per-message analytics for the admin UI.
database = "/var/lib/qqbot/usage.db"
retention_days = 90
event_retention_days = 90

[admin]
# Admin UI: authenticated model/approval/sticker/story mutations.
# Bind localhost and reach it through Workbench port forwarding:
# workbench forward start --remote-port 8080 --local-port 8080.
enabled = true
host = "127.0.0.1"     # 0.0.0.0 only if the port is restricted in the security group
port = 8080
session_hours = 12
# Optional second gate: only these source IPs/CIDRs may reach the panel.
# Behind Cloudflare Tunnel the source is 127.0.0.1, so leave this empty there.
allow_cidrs = []
# React/shadcn bundle served by bot/admin_ui.py.
static_dir = "/opt/qqbot/admin/dist"

[feeds]
# RSS/Atom subscriptions forwarded into the chat where they were added.
# Bilibili is blocked for this host's IP (-412), so it goes through RSSHub.
enabled = true
database = "/var/lib/qqbot/feeds.db"
rsshub_base = "https://rsshub.liumingye.cn"
check_seconds = 300
max_new = 5
max_subs = 50

[meme]
# Text memes: the model marks a reply with "[梗图: 文字]"; a sticker is used as
# the base image (or a gradient card when the library is empty).
enabled = true
max_chars = 24
cooldown_seconds = 30
directory = "/var/lib/qqbot/memes"

[voice]
# TTS voice replies; the model marks a short reply with "[语音]".
# provider: edge (free) | stepfun (Chinese voices) | fish (unreachable here)
enabled = true
provider = "edge"
voice = "zh-CN-XiaoxiaoNeural"
rate = "+0%"
# Provider-specific settings (voice is an edge name / StepFun voice id /
# Fish reference_id). StepFun voices: ruanmengnvsheng, yuanqishaonv,
# tianmeinvsheng, lengyanyujie, ...
model = "stepaudio-3-tts"
api_key_env = "STEPFUN_API_KEY"
base_url = "https://api.stepfun.com"
# Only stepaudio-2.5/3-tts read this; e.g. "傲娇、带点撒娇，语速稍快".
instruction = ""
speed = 1.0
# Chance to voice a proactive group reply the model did not mark [语音].
probability = 0.4
# 0 = no extra cap (provider limit is 1000); set e.g. 300 to keep voice replies short.
max_chars = 0
cooldown_seconds = 30

[tasks]
# Admin-only scheduled messages. Creation is semantic: one thin-client call
# turns "/task add 每天早上8点提醒大家喝水" into a validated schedule.
enabled = true
database = "/var/lib/qqbot/tasks.db"
check_seconds = 20         # scheduler poll interval
max_tasks = 50
max_per_chat = 10

[daily]
# Playful recap of the previous day, sent at the boundary below (00:00 =
# midnight, i.e. "summarize yesterday as the day ends"). Stats come from
# memory.db; the commentary is one thin-client call in the active card's
# voice. If generation fails, a stats-only report is still sent.
enabled = true
database = "/var/lib/qqbot/daily.db"
hour = 0                    # delivery boundary, Asia/Shanghai
minute = 0
groups = []                 # empty = every group active that day
private = false             # also recap private chats (>= min_messages)
min_messages = 5            # quieter chats are skipped (and remembered as skipped)
max_late_hours = 6          # after this, a missed day is not sent retroactively
check_seconds = 60
sample_chars = 1600         # chat excerpt budget for the model
max_chars = 320             # commentary length cap
max_attempts = 3            # generation/send retries within the late window
min_repeat = 3              # messages in a row to call out a 复读现场
prompt = ""                 # extra style hint appended to the commentary prompt

[approvals]
# Friend requests, group invitations and group join requests pushed by NapCat
# as OneBot 11 "request" events. The bot stores them in SQLite; the admin UI
# queues approve/reject actions and the bot executes them over OneBot.
enabled = true
database = "/var/lib/qqbot/approvals.db"
check_seconds = 3          # how often queued admin decisions are executed

[bot]
# Admin QQ numbers. The ADMIN_QQ_IDS env var (comma/space separated) wins;
# this list is the fallback for local runs.
# admins = [2834040317]
reply_private = true
reply_group_at = true      # answer only when @-mentioned in groups
history_turns = 24         # user/assistant pairs kept per conversation
max_history_chars = 12000
max_reply_chars = 1200     # longer replies are split into several QQ messages
max_input_chars = 4000
lore_max_chars = 4000
greeting_on_first_chat = false
notify_errors = true
error_message = "（我这边网络或模型出了点问题，等一下再试）"
# Group chat: messages that don't @ the bot are buffered per group (memory only)
# and handed to the model together with the next @, so it can follow the topic.
group_context_messages = 30
group_context_chars = 3000
# Recent group images the model gets to see on the next reply (own message
# images are always included). 0 disables it; max 4.
group_context_images = 2

# Proactive group replies: join the conversation without being @-mentioned.
[bot.proactive]
enabled = false
groups = []                # empty = all groups
probability = 0.15         # per eligible message; lower = quieter
cooldown_seconds = 90      # minimum gap between proactive replies, per group
max_per_hour = 12
max_per_day = 60
min_context_messages = 2
keywords = []              # interest words: force a proactive attempt (quota still applies)
aliases = []               # extra names for direct address; the active card's
                           # name/nickname are always included automatically
quiet_hours = [1, 7]       # [start, end) local hours; wraps past midnight
followup_seconds = 300     # keep joining nearby messages this long after speaking
followup_multiplier = 2.0  # probability multiplier inside that window
prompt = "你正在群里和大家聊天。结合上面的最近消息，简短、自然地接一句；不要复述别人的话，不要长篇大论，不要提自己是 AI。"

[paths]
# Deprecated: used as [cards] bootstrap when that key is absent.
character = "/etc/qqbot/character.json"
database = "/var/lib/qqbot/memory.db"

[video]
# Metadata lookup plus explicitly requested video delivery; no transcription.
enabled = true
bilibili_enabled = true
douyin_enabled = false  # experimental; may require fresh operator-supplied cookies
# Acknowledge supported links on the original message, even in unaddressed groups.
# Independent of parsing/sending flags; a reaction means received, not processed.
reaction_enabled = true
reaction_emoji_id = "76"  # QQ thumbs-up; 1-10 digit nonzero decimal string
timeout = 30
concurrency = 2
calls_per_turn = 3
cache_seconds = 300
cache_entries = 128
# Optional Netscape cookie files, platform-specific and readable only by the service.
# Never paste cookies into chat; these files are loaded in memory and not rewritten.
credentials_directory = "/var/lib/qqbot/video-credentials"  # admin-managed, outside workspace
bilibili_cookies = ""
douyin_cookies = ""

# Explicit parse/send requests deliver a bounded MP4 to the originating conversation.
# Requires ffmpeg/ffprobe and the read-only NapCat outbox mount; see README.
send_enabled = true
media_directory = "/var/lib/qqbot/video-media"
delivery_database = "/var/lib/qqbot/video-deliveries.db"
container_directory = "/app/qqbot-video"
max_send_bytes = 67108864
max_send_duration = 600
send_timeout = 90
ffmpeg = "/usr/bin/ffmpeg"
ffprobe = "/usr/bin/ffprobe"
