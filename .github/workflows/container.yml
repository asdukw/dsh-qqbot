name: Container validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image and draft release (requires a v* tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Frontend gates
        working-directory: admin
        run: npm ci && npm run typecheck && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend gates
        run: |
          python -m venv .venv
          .venv/bin/pip install -r bot/requirements.txt -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          .venv/bin/ruff check .
          .venv/bin/pyright
          .venv/bin/python -m unittest discover -s tests -v
      - name: Build local image
        run: docker build --progress=plain -t qqbot:local .
      - name: Isolated Compose smoke (no real QQ or provider)
        run: bash deploy/test-container.sh

  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Package deployment files
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p bundle/qqbot-deploy
          cp compose.yaml .env.example bundle/qqbot-deploy/
          cp docs/containers.md bundle/qqbot-deploy/README.md
          sed -i "s|QQBOT_IMAGE=qqbot:local|QQBOT_IMAGE=$IMAGE|" bundle/qqbot-deploy/.env.example
          sed -i 's/^    build: \.$//' bundle/qqbot-deploy/compose.yaml
          tar -C bundle -czf qqbot-deploy.tar.gz qqbot-deploy
          sha256sum qqbot-deploy.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes qqbot-deploy.tar.gz SHA256SUMS
