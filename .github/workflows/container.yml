name: Container validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image and draft release (requires a v* tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Frontend gates
        working-directory: admin
        run: npm ci && npm run typecheck && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend gates
        run: |
          python -m venv .venv
          .venv/bin/pip install -r bot/requirements.txt -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          .venv/bin/ruff check .
          .venv/bin/pyright
          .venv/bin/python -m unittest discover -s tests -v
      - name: Build local image
        run: docker build --progress=plain -t qqbot:local .
      - name: Isolated Compose smoke (no real QQ or provider)
        run: bash deploy/test-container.sh

  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Package deployment files
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p bundle/qqbot-deploy
          cp compose.yaml .env.example LICENSE bundle/qqbot-deploy/
          cp docs/containers.md bundle/qqbot-deploy/README.md
          sed -i "s|QQBOT_IMAGE=qqbot:local|QQBOT_IMAGE=$IMAGE|" bundle/qqbot-deploy/.env.example
          sed -i 's/^    build: \.$//' bundle/qqbot-deploy/compose.yaml
          tar -C bundle -czf qqbot-deploy.tar.gz qqbot-deploy
          sha256sum qqbot-deploy.tar.gz > SHA256SUMS
          cat > RELEASE_NOTES.md <<EOF
          ## DeepSeek Harness QQ Bot ${GITHUB_REF_NAME}

          ### 镜像与快速开始

          - 镜像：$IMAGE（仅构建并验证 linux/amd64）。
          - 下载 qqbot-deploy.tar.gz 和 SHA256SUMS，执行 sha256sum -c SHA256SUMS 后解压。
          - 在解压目录复制 .env.example 为 .env，填入独立的管理密码、OneBot token 和 NapCat WebUI token。
          - 执行 docker compose pull && docker compose up -d --no-build；部署包不需要源码、Python 或 Node。

          ### 配置与限制

          - 管理面板和 NapCat WebUI 默认只绑定宿主机 localhost；远程访问请使用 SSH 端口转发，不要直接暴露公网。
          - 模型在管理面板「模型」页配置供应商、模型和 API key 后激活；凭据存入持久化数据卷。
          - 持久化卷包括 bot 数据、配置、视频 outbox、NapCat QQ 登录态、配置和插件；升级前请备份并保留同一 Compose 项目名。
          - 本版本未进行真实 QQ 扫码/消息发送验收，arm64 也未进行整套验收；QQ 协议兼容性不由本项目保证。

          ### 许可证与第三方组件

          - 本项目源代码使用 MIT；镜像内的 DeepSeek Harness SDK/runtime 为 0.2.1rc2，并随包保留其 MIT LICENSE 和 runtime 的 THIRD_PARTY_NOTICES.md。
          - Python、Node、FFmpeg、字体及其他依赖各自适用其许可证；镜像保留相应发行版元数据/声明，不能将整个镜像统称为 MIT。
          - NapCat 使用 compose 中固定 digest 的上游镜像，未合并进 qqbot 镜像；请按上游项目条款使用。
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md qqbot-deploy.tar.gz SHA256SUMS
