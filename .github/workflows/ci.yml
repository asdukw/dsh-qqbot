name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m py_compile bot/*.py deploy/update-bot-env.py dsh/fake_llm.py

      - name: Shell syntax
        run: |
          for f in deploy/*.sh deploy/napcat/*.sh; do
            bash -n "$f"
          done
