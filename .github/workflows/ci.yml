name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r bot/requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Pyright (standard)
        run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bot/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m py_compile bot/*.py deploy/update-bot-env.py dsh/fake_llm.py

      - name: Shell syntax
        run: |
          for f in deploy/*.sh deploy/napcat/*.sh; do
            bash -n "$f"
          done
