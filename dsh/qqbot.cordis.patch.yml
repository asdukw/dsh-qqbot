# qqbot: chat-only profile with file-backed memory. No shell, no PTY.

# ── remove coding-agent surface ─────────────────────────────────
- id: session-title
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: llm-deepseek
  disabled: true
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: jobs
  disabled: true
- id: tool-working-directory
  disabled: true

# ── file tools stay, scoped to the memory workspace ─────────────
- id: tool-fs
  config:
    read: true
    # Let the model open an original image on demand (the placeholder path
    # only carries a description; details stay in the file).
    readImage: true
    write: true
    edit: true
    readLimit: 2000
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /var/lib/qqbot/dsh-workspace

# ── context pressure: DSH default (80% threshold, 16% retained) ─
- id: compaction-basic
  config:
    # Image history is now stored as text placeholders, so keep the stock
    # 1M-window policy while evaluating the change.
    thresholdRatio: 0.8
    headroomTokens: 16384
    retainRatio: 0.16
    auto: true

# ── no DeepSeek session-log upload ──────────────────────────────
- id: session-log-deepseek
  config:
    enabled: false

# ── search + observation policy + model routes + profile ────────
- insert:
    # Official model-free pruner: compaction-basic calls it at pressure or
    # context overflow, replacing an oversized tool result's middle with a
    # marker while keeping the head and tail.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'
    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false
    # Routes are rendered from the SQLite model registry (bot/models.py) into
    # models.patch.json and applied at launch; this row only mounts the adapter.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: {}
    - id: user-profile
      name: '/opt/qqbot/dsh/plugins/user-profile.mjs'
    # Web search/fetch: the official service and model-facing tools, with a
    # keyless provider instead of the exa/perplexity/deepseek ones (each of
    # those needs its own API key; the keyless backend matches what OpenCode's
    # own websearch tool uses).
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: keyless
        fetchProvider: http
    - id: web-search-keyless
      name: '/opt/qqbot/dsh/plugins/web-search-keyless.mjs'
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        search: true
        fetch: true
        searchMaxResults: 5
        searchTimeoutMs: 30000
